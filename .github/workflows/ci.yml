name: Validate book

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libcairo2-dev libpango1.0-dev \
            pkg-config ffmpeg texlive-latex-base texlive-fonts-recommended \
            texlive-latex-extra dvisvgm

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Node.js for Jupyter Book
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0

      - name: Install locked dependencies
        run: uv sync --locked --extra quantum --extra animation

      - name: Lint and test
        run: make check test

      - name: Build executed book and visual assets
        run: make build
