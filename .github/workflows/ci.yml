name: Validate book

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Manim system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev libcairo2-dev libpango1.0-dev \
            pkg-config ffmpeg texlive-latex-base texlive-fonts-recommended \
            texlive-latex-extra dvisvgm

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Node.js for Jupyter Book
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.17.0

      - name: Install locked dependencies
        run: uv sync --locked --extra quantum --extra animation

      - name: Lint and test
        run: make check test

      - name: Build executed book and visual assets
        run: make build
