name: Validate CUDA-Q

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cudaq.yml
      - pyproject.toml
      - uv.lock
      - scripts/cudaq_smoke.py
      - "content/**/*.ipynb"

permissions:
  contents: read

jobs:
  validate-cudaq:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Node.js for Jupyter Book
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0

      - name: Install locked CUDA-Q environment
        run: uv sync --locked --extra quantum --extra cudaq

      - name: Check CUDA-Q CPU target
        run: make cudaq-test

      - name: Execute book with CUDA-Q available
        run: make build-cudaq
