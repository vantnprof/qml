name: Validate CUDA-Q

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cudaq.yml
      - pyproject.toml
      - uv.lock
      - scripts/cudaq_smoke.py
      - "content/**/*.ipynb"

permissions:
  contents: read

jobs:
  validate-cudaq:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Node.js for Jupyter Book
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0

      - name: Install locked CUDA-Q environment
        run: uv sync --locked --extra quantum --extra cudaq

      - name: Check CUDA-Q CPU target
        run: make cudaq-test

      - name: Execute book with CUDA-Q available
        run: make build-cudaq
