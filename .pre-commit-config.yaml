repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
  - repo: local
    hooks:
      - id: locked-environment
        name: verify uv lockfile
        entry: uv lock --check
        language: system
        pass_filenames: false
      - id: notebook-policy
        name: validate content notebooks
        entry: uv run --locked python scripts/check_notebooks.py
        language: system
        pass_filenames: false
        files: ^content/.*\.ipynb$
