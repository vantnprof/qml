# Jupyter Book 2 uses the MyST v1 configuration schema. The value below is the
# schema version, not the installed Jupyter Book package version.
version: 1
extends:
  - metadata/published.yml

project:
  id: 397ec672-780b-48e0-8fc7-68104b7fa65a
  title: Quantum Machine Learning
  description: Research notes by Van Tien Nguyen on quantum computing and machine learning, with mathematical explanations, interactive visualizations, and notebook experiments.
  index: index.tex
  authors:
    - name: Van Tien Nguyen
  keywords:
    - quantum computing
    - machine learning
    - quantum machine learning
    - Qiskit
    - PennyLane
    - CUDA-Q
    - Manim
  bibliography:
    - bib/bib.bib
  requirements:
    - pyproject.toml
    - uv.lock
  plugins:
    - plugins/publication.mjs
    - plugins/page-dates.mjs
    - plugins/content-includes.mjs
    - plugins/homepage.mjs
  static_files:
    - static/bloch-sphere.html
  exclude:
    - README.md
    - CONTRIBUTING.md
    - docs/**
    - sidebar-footer.md
    - animations/**
    - scripts/**
    - tests/**
    - plugins/**
    - metadata/**
site:
  template: book-theme
  title: Quantum Machine Learning
  options:
    favicon: static/logo_and_cover/qml-favicon.png
    logo: static/logo_and_cover/qml-logo.webp
    logo_alt: Quantum Machine Learning
    logo_text: Quantum Machine Learning
    folders: false
    numbered_references: true
    style: static/site.css
  parts:
    primary_sidebar_footer: sidebar-footer.md
  nav:
    - title: About the author
      url: https://vantnprof.github.io
