[project]
name = "qml-book"
version = "0.1.0"
description = "Reproducible environment for the Quantum Machine Learning Jupyter Book"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ipykernel>=7.1,<8",
  "jupyter-book>=2.1.6,<3",
  "jupyter-server>=2.21,<3",
  "jupyterlab>=4.6.3,<5",
]

[project.optional-dependencies]
quantum = [
  "matplotlib>=3.10,<4",
  "pennylane>=0.45.1,<0.46",
  "pennylane-qiskit>=0.45,<0.46",
  # PennyLane-Qiskit 0.45 currently caps Qiskit at 2.3.0.
  "qiskit[visualization]==2.3.0",
  "qiskit-aer>=0.17.2,<0.18",
]
animation = [
  "manim>=0.21,<0.22",
]
cudaq = [
  "cudaq>=0.15.1,<0.16; (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

[dependency-groups]
dev = [
  "nbclient>=0.11,<0.12",
  "nbformat>=5.10,<6",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "ruff>=0.16.6,<0.17",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["_build", "static/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"animations/*.py" = ["F403", "F405"]
"content/**/*.ipynb" = ["E402"]
"content/workflow-examples/cudaq-bell-state.ipynb" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
